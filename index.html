<!DOCTYPE html>
<html lang="ko">
<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#0e1b24;color:#eaf2f5;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px;padding:8px 12px;background:#2c7a7b;color:#fff;font-size:14px;transition:.15s}
button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
button:disabled{background:#33444d;color:#78909c;cursor:not-allowed}
#wrap{max-width:1100px;margin:0 auto;padding:10px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px}
header h1{font-size:20px}
header .btns{display:flex;gap:5px;flex-wrap:wrap}
header .btns button{background:#37474f;font-size:12px;padding:6px 10px}
#scene{height:150px;border-radius:12px;position:relative;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:30px;padding-bottom:6px;margin-bottom:8px;transition:background .8s}
#scene canvas{position:absolute;inset:0;width:100%;height:100%}
#sc-art{position:relative;z-index:1;white-space:nowrap;transition:filter .5s}
.w-clear{background:linear-gradient(#4fc3f7,#b3e5fc 60%,#f6d99c 61%)}
.w-cloudy{background:linear-gradient(#90a4ae,#cfd8dc 60%,#e0c58f 61%)}
.w-rain{background:linear-gradient(#546e7a,#78909c 60%,#b9a173 61%)}
.w-storm{background:linear-gradient(#263238,#455a64 60%,#8d7b58 61%)}
.w-heat{background:linear-gradient(#ff8a65,#ffcc80 60%,#f4c06a 61%)}
#scene .badge,#scene .badge2{position:absolute;top:8px;z-index:2;background:rgba(0,0,0,.5);padding:4px 10px;border-radius:20px;font-size:13px}
#scene .badge{left:10px;font-size:14px}#scene .badge2{right:10px}
#hint{background:#2b3a1f;border:1px solid #689f38;border-radius:10px;padding:7px 12px;font-size:13px;margin-bottom:8px;color:#dcedc8}
#stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.stat{background:#17303c;border-radius:10px;padding:8px}
.stat .lb{font-size:12px;display:flex;justify-content:space-between;margin-bottom:4px}
.bar{height:10px;background:#0b1419;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transition:width .3s}
#main{display:grid;grid-template-columns:1.1fr 1fr;gap:8px}
.panel{background:#17303c;border-radius:12px;padding:10px}
.panel h3{font-size:14px;margin-bottom:8px;color:#80deea}
#areas{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#areas button{background:#26424f;font-size:12px;padding:6px 9px}
#areas button.on{background:#f9a825;color:#222;font-weight:bold}
.adesc{font-size:12px;color:#b0bec5;margin-bottom:8px;line-height:1.5}
.act{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;margin-bottom:6px;background:#26424f}
.act small{color:#b0e0e6;display:block;font-size:11px;font-weight:normal}
.act .c{white-space:nowrap;font-size:12px;color:#ffd54f}
.tabs{display:flex;gap:5px;margin-bottom:8px}
.tabs button{flex:1;background:#26424f;padding:7px 4px;font-size:13px}
.tabs button.on{background:#f9a825;color:#222;font-weight:bold}
.inv{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.it{background:#0f222b;border-radius:8px;padding:5px 8px;display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:4px}
.it.zero{opacity:.35}
.it small{color:#90a4ae;font-size:10px}
.it button{padding:3px 8px;font-size:11px;background:#2e7d32}
.status{font-size:12px;color:#b0bec5;margin-top:8px;line-height:1.7}
.rc{background:#0f222b;border-radius:8px;padding:8px;margin-bottom:6px}
.rc .t{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:6px}
.rc .d{font-size:11px;color:#b0bec5;margin:3px 0}
.rc .cs{font-size:12px}
.ok{color:#a5d6a7}.no{color:#ef9a9a}
.done{display:inline-block;background:#1b5e20;border-radius:12px;padding:2px 8px;font-size:11px;margin:2px}
.cx-t{font-size:13px;color:#ffd54f;margin:10px 0 5px;display:flex;justify-content:space-between}
.cx{display:flex;flex-wrap:wrap;gap:5px}
.cxi{background:#0f222b;border-radius:8px;padding:4px 6px;font-size:18px;text-align:center;min-width:56px}
.cxi small{display:block;font-size:10px;color:#b0bec5}
.cxi.lock{opacity:.35}
.ach{display:flex;gap:8px;align-items:center;font-size:12px;background:#0f222b;border-radius:8px;padding:5px 8px;margin-bottom:4px}
.ach.lock{opacity:.4}
.sk{background:#0f222b;border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px}
.sk small{color:#b0bec5;font-size:11px;display:block;margin:2px 0 5px}
#log{margin-top:8px;max-height:170px;overflow:auto;font-size:13px;line-height:1.6}
#log div{border-bottom:1px solid #22414f;padding:2px 0}
#log .bad{color:#ff8a80}#log .good{color:#b9f6ca}#log .sys{color:#ffd180}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;z-index:10;padding:14px}
#ov.show{display:flex}
#md{background:#17303c;border:2px solid #f9a825;border-radius:14px;padding:18px;max-width:470px;width:100%;max-height:92vh;overflow:auto}
#md.wide{max-width:680px}
#md h2{margin-bottom:10px;font-size:18px}
#mb{font-size:14px;line-height:1.7;margin-bottom:14px}
#mbtn{display:flex;flex-direction:column;gap:8px}
#mbtn.row{flex-direction:row;flex-wrap:wrap}#mbtn.row button{flex:1}
#mbtn button{padding:10px}
.tb{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0 10px}
.tb th{background:#0f222b;color:#80deea;padding:5px;text-align:left}
.tb td{border-bottom:1px solid #22414f;padding:5px;vertical-align:top}
.tl{padding-left:18px;font-size:13px;margin:6px 0}.tl li{margin-bottom:4px}
.dopt{background:#0f222b;border-radius:8px;padding:8px;margin-bottom:6px;font-size:13px}
.dopt small{color:#b0bec5}
.dopt label{display:flex;gap:8px;align-items:center;font-size:12px;margin-top:4px}
.dopt input{flex:1}
#toasts{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,40,50,.96);border:1px solid #f9a825;padding:8px 14px;border-radius:20px;font-size:13px;animation:tin .3s,tout .5s 2.4s forwards}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
@media(max-width:760px){#main{grid-template-columns:1fr}#stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>🏝️ 무인도 30일 생존기</h1>
    <div class="btns">
      <button onclick="tutorial(0,null,'닫기')">❓ 도움말</button>
      <button id="b-sfx" onclick="togSfx()"></button>
      <button id="b-bgm" onclick="togBgm()"></button>
      <button onclick="showStartMenu(true)">🔄 새 게임</button>
    </div>
  </header>
  <div id="scene"><canvas id="cv"></canvas><div class="badge" id="sc-day"></div><div class="badge2" id="sc-w"></div><div id="sc-art"></div></div>
  <div id="hint"></div>
  <div id="stats">
    <div class="stat"><div class="lb"><span>❤️ 체력</span><span id="v-hp"></span></div><div class="bar"><i id="b-hp" style="background:#ef5350"></i></div></div>
    <div class="stat"><div class="lb"><span>🍖 포만감</span><span id="v-food"></span></div><div class="bar"><i id="b-food" style="background:#ffa726"></i></div></div>
    <div class="stat"><div class="lb"><span>💧 수분</span><span id="v-water"></span></div><div class="bar"><i id="b-water" style="background:#29b6f6"></i></div></div>
    <div class="stat"><div class="lb"><span>⏱ 남은 시간</span><span id="v-time"></span></div><div class="bar"><i id="b-time" style="background:#ab47bc"></i></div></div>
  </div>
  <div id="main">
    <div class="panel">
      <h3>📍 장소 · 행동</h3>
      <div id="areas"></div>
      <div class="adesc" id="adesc"></div>
      <div id="acts"></div>
    </div>
    <div class="panel">
      <div class="tabs" id="tabs"></div>
      <div id="side"></div>
    </div>
  </div>
  <div class="panel" style="margin-top:8px"><h3>📜 일지</h3><div id="log"></div></div>
</div>
<div id="ov"><div id="md"><h2 id="mt"></h2><div id="mb"></div><div id="mbtn"></div></div></div>
<div id="toasts"></div>

<script>
/* ================= 기본 유틸 ================= */
const KEY='island30_save_v2',MKEY='island30_meta_v2';
let S=null;
const $=id=>document.getElementById(id);
const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ================= 메타 (도감·기록·설정) ================= */
let META={tutorial:0,items:{},events:{},recipes:{},areas:{camp:1},endings:{},ach:{},best:{score:0,day:0},plays:0,wins:0,fails:0,sfx:1,bgm:1,hardWin:0};
function loadMeta(){try{const d=JSON.parse(localStorage.getItem(MKEY));if(d)META=Object.assign(META,d)}catch(e){}}
function saveMeta(){try{localStorage.setItem(MKEY,JSON.stringify(META))}catch(e){}}

/* ================= 사운드 (WebAudio 합성) ================= */
const SND={ctx:null,rain:null};
function AC(){
  if(!SND.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;SND.ctx=new C()}
  if(SND.ctx.state==='suspended')SND.ctx.resume();return SND.ctx;
}
function tone(f,d,type,v,delay,slide){
  const c=SND.ctx;if(!c)return;const t=c.currentTime+(delay||0);
  const o=c.createOscillator(),g=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function noiseBurst(d,v,freq){
  const c=SND.ctx;if(!c)return;const len=Math.floor(c.sampleRate*d),buf=c.createBuffer(1,len,c.sampleRate),a=buf.getChannelData(0);
  for(let i=0;i<len;i++)a[i]=(Math.random()*2-1)*(1-i/len);
  const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq;
  const g=c.createGain();g.gain.value=v;s.connect(f);f.connect(g);g.connect(c.destination);s.start();
}
const SFX={
  click:()=>tone(660,.05,'square',.025),
  get:()=>{tone(523,.08,'triangle',.07);tone(784,.1,'triangle',.07,.07)},
  hurt:()=>tone(220,.25,'sawtooth',.07,0,.5),
  eat:()=>{tone(300,.06,'square',.05);tone(380,.06,'square',.05,.09)},
  drink:()=>tone(500,.18,'sine',.07,0,1.7),
  craft:()=>{tone(392,.1,'square',.05);tone(523,.1,'square',.05,.1);tone(659,.2,'square',.05,.2)},
  night:()=>[392,330,262].forEach((f,i)=>tone(f,.45,'sine',.07,i*.25)),
  morning:()=>[262,330,392,523].forEach((f,i)=>tone(f,.3,'triangle',.07,i*.15)),
  event:()=>{tone(440,.12,'triangle',.07);tone(554,.12,'triangle',.07,.12)},
  level:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.15,'triangle',.08,i*.1)),
  win:()=>[523,659,784,659,784,1047].forEach((f,i)=>tone(f,.25,'triangle',.09,i*.18)),
  lose:()=>[330,262,208,165].forEach((f,i)=>tone(f,.45,'sawtooth',.06,i*.3)),
  thunder:()=>noiseBurst(1.6,.3,260)
};
function sfx(n){if(!META.sfx||!SND.ctx)return;try{SFX[n]&&SFX[n]()}catch(e){}}
function ambient(){
  const c=SND.ctx;if(!c)return;
  if(!SND.rain){
    const len=c.sampleRate*2,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;src.loop=true;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=1400;f.Q.value=.4;
    const g=c.createGain();g.gain.value=0;src.connect(f);f.connect(g);g.connect(c.destination);src.start();SND.rain=g;
  }
  const w=S?S.weather:'clear';
  const v=(!META.bgm||(S&&S.over))?0:(w==='rain'?.06:w==='storm'?.12:0);
  SND.rain.gain.setTargetAtTime(v,c.currentTime,.4);
}
function bgmStep(){
  if(!SND.ctx||!META.bgm||!S||S.over)return;
  const w=S.weather,night=S.time<=3,bad=(w==='storm'||w==='rain');
  const sc=bad?[0,3,5,7,10]:[0,2,4,7,9],base=night?196:(w==='storm'?174:220);
  const n=1+(Math.random()<.4?1:0);
  for(let i=0;i<n;i++){const st=pick(sc)+(Math.random()<.4?12:0);tone(base*Math.pow(2,st/12),2.4,'sine',.035,i*.6)}
  if(Math.random()<.25)tone(base/2,3,'triangle',.03);
}
setInterval(bgmStep,2400);
document.addEventListener('click',e=>{AC();ambient();if(e.target.closest&&e.target.closest('button:not(:disabled)'))sfx('click')},true);
function togSfx(){META.sfx=META.sfx?0:1;saveMeta();render()}
function togBgm(){META.bgm=META.bgm?0:1;saveMeta();ambient();render()}

/* ================= 토스트 ================= */
function toast(m){const e=document.createElement('div');e.className='toast';e.innerHTML=m;$('toasts').appendChild(e);setTimeout(()=>e.remove(),3000)}

/* ================= 데이터 ================= */
const WEATHER={
  clear:{n:'맑음',i:'☀️',d:'가장 평범하고 활동하기 좋은 날. 뗏목 성공률 +15%.'},
  cloudy:{n:'흐림',i:'☁️',d:'특별한 효과 없음. 뗏목 성공률 +10%.'},
  rain:{n:'비',i:'🌧️',d:'빗물 마시기 가능, 낚시 유리(성공률 +10%, 생선 +1). 집이 없으면 밤에 체력 -6. 빗물통은 물 +3, 어망·텃밭 수확 +1.'},
  storm:{n:'폭풍',i:'⛈️',d:'야외 행동 +1시간, 40% 확률로 체력 -6. 밤에 체력 -15 (움막 -8, 통나무집 -3, 석조집 0). 빗물통 물 +5. 뗏목 성공률 -40%.'},
  heat:{n:'폭염',i:'🥵',d:'수분 소모 시간당 3 (평소 2), 밤 수분 -14 (평소 -8). 뗏목 보정 없음.'}
};
const ITEMS={
  wood:{n:'나무',i:'🪵'},stone:{n:'돌',i:'🪨'},fiber:{n:'섬유',i:'🧵'},metal:{n:'금속 조각',i:'🔩'},
  hide:{n:'가죽',i:'🦌'},pearl:{n:'진주',i:'🦪'},
  berry:{n:'열매',i:'🍓',use:{food:8},spoil:1},
  shellfish:{n:'조개',i:'🐚',use:{food:10},spoil:1},
  egg:{n:'새알',i:'🥚',use:{food:16,hp:2},spoil:1},
  fish:{n:'생선(날것)',i:'🐟',use:{food:14},risk:.2,spoil:1},
  meat:{n:'고기(날것)',i:'🥩',use:{food:18},risk:.25,spoil:1},
  cfish:{n:'구운 생선',i:'🍢',use:{food:32},spoil:1},
  cmeat:{n:'구운 고기',i:'🍖',use:{food:42,hp:3},spoil:1},
  stew:{n:'생존 스튜',i:'🍲',use:{food:45,water:12,hp:6},spoil:1},
  jerky:{n:'육포',i:'🥓',use:{food:26}},
  canned:{n:'통조림',i:'🥫',use:{food:35,water:5}},
  honey:{n:'야생 꿀',i:'🍯',use:{food:12,hp:10}},
  coconut:{n:'코코넛',i:'🥥',use:{food:5,water:18}},
  water:{n:'깨끗한 물',i:'💧',use:{water:30}},
  herb:{n:'약초',i:'🌿',use:{hp:20}},
  salve:{n:'약초 연고',i:'🧴',use:{hp:45}}
};
const AREAS={
  camp:{n:'캠프',i:'🏕️',d:'휴식, 요리, 가공, 하루를 마무리하는 곳입니다.'},
  beach:{n:'해변',i:'🏖️',d:'조개와 유목, 물고기가 있습니다. 비교적 안전합니다.'},
  forest:{n:'정글',i:'🌴',d:'나무, 열매, 약초, 사냥감이 있지만 위험도 있습니다.'},
  rocks:{n:'바위언덕',i:'⛰️',d:'돌의 주요 산지입니다. 깊이 탐험하면 무언가 발견할지도...'},
  cave:{n:'동굴',i:'🕳️',d:'어둡고 위험하지만 귀한 금속이 잠들어 있습니다.',lock:()=>!S.unlocked.cave,lt:'바위언덕을 3번 탐험'},
  falls:{n:'폭포',i:'💦',d:'맑은 물이 끝없이 흐르는 안전한 수원지입니다.',lock:()=>!S.unlocked.falls,lt:'정글을 3번 탐험'},
  reef:{n:'산호초',i:'🪸',d:'조개·물고기·진주가 풍부한 얕은 바다. 해파리를 조심하세요.',lock:()=>!S.unlocked.reef,lt:'해변을 3번 탐험'},
  wreck:{n:'난파선',i:'⚓',d:'좌초된 큰 배의 잔해. 금속과 통조림이 남아 있지만 선체가 불안정합니다.',lock:()=>!S.unlocked.wreck,lt:'산호초를 3번 탐험'},
  peak:{n:'산 정상',i:'🏔️',d:'섬 전체가 내려다보이는 곳. 날씨를 정확히 읽고 배를 찾을 수 있습니다.',lock:()=>!S.unlocked.peak,lt:'동굴을 3번 탐험'}
};
const DIFFS={
  easy:{n:'🌴 쉬움',d:'여유로운 휴양 모드. 시작 보급품(나무4·섬유3·열매3·물3)을 받습니다.',drain:.75,dmg:.7,spoil:.6,sc:.8,start:{wood:4,fiber:3,berry:3,water:3}},
  normal:{n:'🏝️ 보통',d:'기본 밸런스. 처음 하신다면 이 난이도를 권장합니다.',drain:1,dmg:1,spoil:1,sc:1,start:{}},
  hard:{n:'💀 어려움',d:'혹독한 생존. 소모·피해·부패가 크게 늘어납니다. (점수 ×1.3)',drain:1.3,dmg:1.5,spoil:1.4,sc:1.3,start:{}}
};
const SKILLS={
  gather:{i:'🌿',n:'채집가',d:'채집 시 추가 획득 확률 +10%/Lv',g:'줍기·베기·캐기·따기 등 채집 행동'},
  hunt:{i:'🎣',n:'사냥꾼·어부',d:'낚시·사냥 성공률 +4%/Lv, 수확 추가 확률 +10%/Lv',g:'낚시·사냥·작살·둥지 털기'},

}
function heal(n){S.hp=clamp(S.hp+n)}
function gain(k,n){if(n<=0)return'';S.inv[k]=(S.inv[k]||0)+n;META.items[k]=1;return ITEMS[k].i+ITEMS[k].n+' +'+n}
function gainG(k,n){return gain(k,n+(Math.random()<skLv('gather')*.1?1:0))}
function has(k,n){return(S.inv[k]||0)>=n}
function spend(c){
  S.time-=c;const dr=drainMul();
  S.food=clamp(S.food-1.5*c*dr);
  S.water=clamp(S.water-(S.weather==='heat'?3:2)*c*dr);
  if(S.food<=0){const d=H(4,'굶주림');log('🍽️ 굶주려서 힘이 빠진다! 체력 -'+d)}
  if(S.water<=0){const d=H(5,'탈수');log('🏜️ 목이 말라 쓰러질 것 같다! 체력 -'+d)}
}
function checkDeath(){
  if(S.hp<=0&&!S.over){
    S.over=true;localStorage.removeItem(KEY);META.fails++;META.best.day=Math.max(META.best.day,S.day);saveMeta();sfx('lose');ambient();render();
    modal('💀 생존 실패',`<b>${S.day}일차</b>에 <b>${S.cause||'알 수 없는 이유'}</b>(으)로 쓰러졌다...<br><br>다음엔 더 잘 준비해 보자.<br><small>최고 기록: ${META.best.day}일 / 최고 점수 ${META.best.score}</small>`,[{t:'다시 도전',fn:()=>showStartMenu(false)}]);
    return true;
  }
  return S.over;
}

/* ================= 탐험 공통 처리 ================= */
function explore(area,loot,badTxt,badDmg,cause,key,msg){
  S.explore[area]++;let m;const r=Math.random()-skLv('explore')*.04;
  if(r<.5)m='탐험 중 '+loot()+' 발견!';
  else if(r<.7)m=badTxt+' 체력 -'+H(badDmg,cause,1);
  else m='특별한 것은 발견하지 못했다.';
  if(S.explore[area]>=3&&!S.unlocked[key]){S.unlocked[key]=true;m+='\n'+msg;toast('🧭 새로운 장소 발견!')}
  return m;
}

function perform(id){
  if(S.over)return;const a=ACTIONS.find(x=>x.id===id);
  if(a.special){sleep();return}
  const cost=a.cost+((S.weather==='storm'&&a.out)?1:0);
  if(S.time<cost){log('⏱ 시간이 부족하다. 잠을 자자.','sys');render();return}
  const m=a.run();
  if(S.over)return;
  log(m);spend(cost);
  if(a.sk)addXp(a.sk,Math.max(1,a.cost));
  if(S.weather==='storm'&&a.out&&Math.random()<(S.built.clothes?.2:.4)){const d=H(6,'폭풍',1);log('⛈️ 폭풍에 휘말려 다쳤다! 체력 -'+d)}
  if(!/체력 -/.test(m))sfx('get');
  afterAction();
}
function afterAction(){
  if(checkDeath())return;
  if(S.time<=0){log('🌙 해가 저물었다...','sys');endDay()}else{save();render()}
}
function sleep(){
  if(S.time>0){heal(S.time);log(`😴 일찍 잠들어 체력 +${S.time}`,'good')}
  S.time=0;endDay();
}
function useItem(k){
  if(!has(k,1)||S.over)return;const it=ITEMS[k];S.inv[k]--;const m=[];
  if(it.use.food){S.food=clamp(S.food+it.use.food);m.push('포만감 +'+it.use.food)}
  if(it.use.water){S.water=clamp(S.water+it.use.water);m.push('수분 +'+it.use.water)}
  if(it.use.hp){heal(it.use.hp);m.push('체력 +'+it.use.hp)}
  sfx(it.use.water&&!it.use.food?'drink':'eat');
  let t=`${it.i} ${it.n} 사용: ${m.join(', ')}`;
  if(it.risk&&Math.random()<it.risk)t+='\n으윽, 배탈이 났다! 체력 -'+H(8,'배탈');
  log(t);if(!checkDeath()){save();render()}
}

const effCost=r=>{const o={},l=skLv('craft');Object.entries(r.cost).forEach(([k,n])=>o[k]=Math.max(1,Math.round(n*(1-.08*l))));return o};
const effT=r=>Math.max(1,r.t-((skLv('craft')>=4&&r.t>=2)?1:0));
function canCraft(r){return Object.entries(effCost(r)).every(([k,n])=>has(k,n))&&S.time>=effT(r)}
function craft(id){
  if(S.over)return;const r=RECIPES.find(x=>x.id===id);if(!canCraft(r))return;
  const c=effCost(r),t=effT(r);
  Object.entries(c).forEach(([k,n])=>S.inv[k]-=n);
  r.apply();META.recipes[id]=1;
  log(`🔨 ${r.i} ${r.n} 제작 완료! 획득`,'good');toast(`🔨 ${r.i} ${r.n} 제작 완료!`);sfx('craft');
  addXp('craft',r.t*2);spend(t);afterAction();
}

function endDay(){
  const L=[],sh=S.built.shelter,dr=drainMul();sfx('night');
  S.food=clamp(S.food-8*dr);S.water=clamp(S.water-(8+(S.weather==='heat'?6:0))*dr);
  L.push('🌙 밤새 허기와 갈증이 찾아왔다.');
  let fireOn=false;
  if(S.built.fire){
    if(has('wood',1)){S.inv.wood--;fireOn=true;L.push('🔥 모닥불에 땔감 1개를 넣었다.')}
    else L.push('🥶 땔감이 없어 모닥불이 꺼졌다!');
  }
  let dmg=0,why='',txt='';
  if(S.weather==='storm'){dmg=[15,8,3,0][sh];why='폭풍';txt=dmg?'⛈️ 폭풍이 몰아쳤다!':'⛈️ 폭풍이 몰아쳤지만 튼튼한 집 덕에 무사했다.'}
  else if(S.weather==='rain'){if(sh===0){dmg=6;why='저체온증';txt='🌧️ 비를 맞으며 밤을 보냈다.'}}
  else if(!fireOn&&sh===0){dmg=3;why='추위';txt='🥶 차가운 밤바람에 몸이 떨렸다.'}
  const raw=dmg;
  if(S.built.clothes&&dmg>0)dmg=Math.max(0,dmg-3);
  if(fireOn&&dmg>0)dmg=Math.floor(dmg/2);
  if(dmg>0){const d=H(dmg,why);L.push(`${txt} 체력 -${d}`)}
  else if(raw>0)L.push(`${txt} 하지만 따뜻하게 버텨 피해는 없었다.`);
  else if(txt)L.push(txt);
  if(S.built.barrel&&(S.weather==='rain'||S.weather==='storm')){const n=S.weather==='storm'?5:3;S.inv.water=(S.inv.water||0)+n;META.items.water=1;L.push(`🪣 빗물통에 물이 찼다. 💧 +${n}`)}
  const rate=(S.built.rack?.08:.3)*D().spoil,sp=[];
  Object.keys(ITEMS).forEach(k=>{if(ITEMS[k].spoil&&S.inv[k]>0){const l=Math.min(S.inv[k],Math.floor(S.inv[k]*rate+Math.random()));if(l){S.inv[k]-=l;sp.push(ITEMS[k].i+'×'+l)}}});
  if(sp.length)L.push('🤢 상해서 버린 음식: '+sp.join(' '));
  const rainy=S.weather==='rain'||S.weather==='storm';
  if(S.built.trap&&Math.random()<.45){L.push('🪤 덫에 사냥감이 걸렸다! '+gain('meat',1)+(Math.random()<.25?', '+gain('hide',1):''))}
  if(S.built.net){L.push('🕸️ 어망에 물고기가 걸렸다! '+gain('fish',rnd(1,2)+(rainy?1:0)))}
  if(S.built.garden){let t='🌱 텃밭에서 수확! '+gain('berry',rnd(2,3)+(rainy?1:0));if(Math.random()<.35)t+=', '+gain('herb',1);L.push(t)}
  if(S.food>30&&S.water>30){const h=6+sh*3+(fireOn?3:0)+(S.built.hammock?3:0)+skLv('survive');heal(h);L.push(`💤 푹 자서 체력 +${h}`)}
  if(S.food<=0){const d=H(10,'굶주림');L.push('🍽️ 굶주림으로 체력 -'+d)}
  if(S.water<=0){const d=H(12,'탈수');L.push('🏜️ 탈수로 체력 -'+d)}
  if(checkDeath())return;
  if(S.day>=30){ending('rescue');return}
  addXp('survive',3);
  S.day++;S.time=12;S.weather=S.nextWeather;S.nextWeather=pickWeather(S.day+1);setForecast();S.signalToday=false;
  L.push(`<br>🌅 <b>${S.day}일차</b> 아침 — 오늘 날씨: ${WEATHER[S.weather].i} ${WEATHER[S.weather].n}`);
  L.forEach(x=>log(x.replace(/<br>/g,''),'sys'));
  ambient();save();render();
  modal(`🌙 ${S.day-1}일차 밤이 지나갔다`,L.join('<br>'),[{t:'아침을 맞이한다',fn:()=>{sfx('morning');showEvent()}}]);
}

  return lost.length?lost.join(' ')+' 을(를) 잃었다.':'다행히 훔쳐갈 식량이 없었다.';
}

function showEvent(){
  if(S.over)return;
  let pool=EVENTS.filter(e=>(!e.when||e.when())&&!S.usedEv.includes(e.id));
  if(!pool.length){S.usedEv=[];pool=EVENTS.filter(e=>!e.when||e.when())}
  const ev=pick(pool);S.usedEv.push(ev.id);META.events[ev.id]=1;saveMeta();sfx('event');
  modal(`${ev.i} ${ev.t}`,ev.d,ev.ch.map(c=>({t:c.t,fn:()=>{
    const r=c.run();log(`${ev.i} [${ev.t}] ${r}`);
    modal(`${ev.i} ${ev.t}`,r.replace(/\n/g,'<br>'),[{t:'확인',fn:()=>{
      if(checkDeath())return;
      if(S.time<=0)endDay();else{save();render()}
    }}]);
  }})));
}

/* ================= 엔딩 ================= */
function ending(type){
  S.over=true;localStorage.removeItem(KEY);
  const b=S.built,tl=S.tools.axe+S.tools.pick+S.tools.rod+S.tools.spear;
  const bc=Object.values(b).filter(v=>v===true).length;
  const mult=(DIFFS[S.dk]||{sc:1}).sc;
  const score=Math.round((S.day*10+S.hp*2+bc*30+b.shelter*40+tl*10+S.rescue*20+(S.inv.pearl||0)*50+(type==='escape'?200:0))*mult);
  let title,txt,grade;
  if(type==='escape'){title='🛶 뗏목 탈출 성공!';grade='S';txt='직접 만든 뗏목으로 거친 바다를 건너 문명 세계로 돌아왔습니다. 진정한 생존의 달인!'}
  else{
    if(b.signal&&S.rescue>=3){grade='S';title='🚁 완벽한 구조!';txt='당신이 피운 봉화를 발견한 구조대가 정확하게 섬으로 찾아왔습니다!'}
    else if(b.signal){grade='A';title='🚢 구조선 도착!';txt='봉화 덕분에 구조선이 섬을 발견했습니다. 30일을 버텨냈습니다!'}
    else{grade='B';title='🛟 간신히 발견되다';txt='지나가던 배가 우연히 당신을 발견했습니다. 신호 수단이 있었다면 더 빨랐을 텐데요.'}
  }
  META.wins++;META.endings[type==='escape'?'escape':grade]=1;
  if(S.dk==='hard')META.hardWin=1;
  const newBest=score>META.best.score;
  META.best.score=Math.max(META.best.score,score);META.best.day=Math.max(META.best.day,S.day);
  checkAch();saveMeta();sfx('win');ambient();render();
  modal(title,`${txt}<br><br>⏳ 생존 일수: <b>${S.day}일</b> (${S.dn})<br>❤️ 남은 체력: <b>${Math.round(S.hp)}</b><br>🏠 집 단계: <b>${b.shelter}</b> / 🚩 구조 신호: <b>${S.rescue}회</b> / 🦪 진주: <b>${S.inv.pearl||0}개</b><br><br>등급: <b style="font-size:24px;color:#ffd54f">${grade}</b><br>점수: <b>${score}</b> ${newBest?'🎉 <b>신기록!</b>':`<small>(최고 ${META.best.score})</small>`}`,[{t:'다시 도전',fn:()=>showStartMenu(false)}]);
}

/* ================= 장면 애니메이션 (Canvas) ================= */
const cv=$('cv'),cx=cv.getContext('2d');
const RAIN=Array.from({length:200},()=>({x:Math.random(),y:Math.random(),v:.012+Math.random()*.012}));
const CLOUDS=Array.from({length:6},(_,i)=>({x:i/6,y:.1+Math.random()*.25,s:.6+Math.random()*.8,v:.0003+Math.random()*.0004}));
let T=0,flash=0;
function fit(){cv.width=cv.clientWidth||600;cv.height=cv.clientHeight||150}
addEventListener('resize',fit);
function anim(){
  requestAnimationFrame(anim);
  if(!S)return;
  const w=cv.width,h=cv.height;cx.clearRect(0,0,w,h);T++;
  const wt=S.weather,p=(12-S.time)/12;
  // 태양
  if(wt==='clear'||wt==='heat'||wt==='cloudy'){
    const x=w*(.08+.84*p),y=h*.5-Math.sin(Math.PI*p)*h*.38;
    const g=cx.createRadialGradient(x,y,2,x,y,34);
    g.addColorStop(0,wt==='heat'?'rgba(255,240,120,1)':'rgba(255,250,200,.95)');g.addColorStop(1,'rgba(255,230,120,0)');
    cx.globalAlpha=wt==='cloudy'?.55:1;cx.fillStyle=g;cx.beginPath();cx.arc(x,y,34,0,7);cx.fill();cx.globalAlpha=1;
  }
  // 구름
  const ca=wt==='clear'?.35:wt==='heat'?.15:wt==='cloudy'?.85:.9;
  const cc=wt==='rain'||wt==='storm'?'#37474f':wt==='cloudy'?'#b0bec5':'#ffffff';
  CLOUDS.forEach(c=>{
    c.x+=c.v*(wt==='storm'?4:1);if(c.x>1.2)c.x=-.2;
    const x=c.x*w,y=c.y*h,s=c.s*22;cx.globalAlpha=ca;cx.fillStyle=cc;
    cx.beginPath();cx.ellipse(x,y,s*1.6,s*.6,0,0,7);cx.ellipse(x-s,y+4,s,s*.5,0,0,7);cx.ellipse(x+s,y+4,s*1.1,s*.5,0,0,7);cx.fill();
  });
  cx.globalAlpha=1;
  // 비
  if(wt==='rain'||wt==='storm'){
    const n=wt==='storm'?200:100;cx.strokeStyle='rgba(220,235,255,.55)';cx.lineWidth=1;cx.beginPath();
    for(let i=0;i<n;i++){const r=RAIN[i];r.y+=r.v*(wt==='storm'?1.6:1);r.x-=r.v*.3;if(r.y>1){r.y=-.05;r.x=Math.random()*1.2}if(r.x<0)r.x=1;
      cx.moveTo(r.x*w,r.y*h);cx.lineTo(r.x*w-3,r.y*h+9)}
    cx.stroke();
  }
  // 번개
  if(wt==='storm'){if(flash<=0&&Math.random()<.004){flash=10;sfx('thunder')}if(flash>0){cx.fillStyle=`rgba(255,255,255,${flash/14})`;cx.fillRect(0,0,w,h);flash--}}
  // 폭염 아지랑이
  if(wt==='heat'){cx.fillStyle=`rgba(255,120,0,${.07+.04*Math.sin(T/25)})`;cx.fillRect(0,0,w,h)}
  // 파도
  cx.strokeStyle='rgba(255,255,255,.55)';cx.lineWidth=2;cx.beginPath();
  for(let x=0;x<=w;x+=6){const y=h*.6+Math.sin(x/22+T/18)*2.5;x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke();
  // 밤 어둠 + 별
  const dark=Math.pow(1-S.time/12,2)*.55;
  if(dark>.02){cx.fillStyle=`rgba(5,10,40,${dark})`;cx.fillRect(0,0,w,h);
    if(S.time<=3){cx.fillStyle='#fff';for(let i=0;i<24;i++){const sx=(i*97%100)/100*w,sy=(i*53%45)/100*h;cx.globalAlpha=.4+.4*Math.sin(T/15+i);cx.fillRect(sx,sy,2,2)}cx.globalAlpha=1}}
}

function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);

window.doAuth=async function(mode){
  const id=document.getElementById('au-id').value.trim().toLowerCase(),pw=document.getElementById('au-pw').value,auto=document.getElementById('au-auto').checked;
  const err=m=>authUI(mode,'⚠️ '+m,id);

  if(pw.length<4)return err('비밀번호는 4자 이상이어야 합니다.');
  const us=users();
  try{
    if(mode==='signup'){

      if(pw!==document.getElementById('au-pw2').value)return err('비밀번호 확인이 일치하지 않습니다.');
      const salt=Math.random().toString(36).slice(2)+Date.now().toString(36),m=bestM();

      enterSession(id,auto);toast('🎉 회원가입 완료! 환영합니다');

      if(!u||await hashPw(pw,u.salt,u.m)!==u.h)return err('아이디 또는 비밀번호가 올바르지 않습니다.');
      enterSession(id,auto);
    }
  }catch(e){err('이 브라우저에서는 보안 해시를 쓸 수 없습니다. 게스트로 플레이해 주세요.')}

/* ---------- 5. 보물지도 ---------- */
function digReq(){
  const n=S.tmap.need;
  if(n==='clear'||n==='rain')return S.weather===n?null:`${NEED[n]}에만 보물이 드러납니다 (오늘: ${WEATHER[S.weather].n})`;
  if(n==='pick')return S.tools.pick?null:'⛏️ 곡괭이가 필요합니다';
  if(n==='rope')return S.built.rope?null:'🪢 밧줄이 필요합니다';
  return has('torch',1)?null:'🔦 횃불이 필요합니다';
}
function dig(){
  const T=S.tmap;if(T.need==='torch')S.inv.torch--;S.tmap=null;
  if(T.fake)return '땅을 파 보니 낡은 돌멩이뿐이었다… 가짜 지도였다!'+(Math.random()<.5?'\n함정이 작동했다! 체력 -'+H(8,'가짜 지도 함정',1):' '+gain('stone',2));
  META.treasures++;
  if(T.danger)return '💀 저주받은 보물! 상자를 열자 검은 연기가 뿜어졌다. 체력 -'+H(14,'저주받은 보물',1)+'\n그러나 안에는 '+[gain('metal',4),gain('pearl',3),gain('canned',2)].join(', ')+'이(가) 있었다!';
  const p=[];
  if(!S.bp.flare&&Math.random()<.5){S.bp.flare=true;p.push('📐 특수 설계도 [신호탄]을 얻었다! (제작 탭)')}
  p.push(gain('metal',3),gain('pearl',1),gain('medkit',1));
  if(Math.random()<.2)p.push(gain('relic',1));
  return '🗺️ 보물 상자를 발굴했다! '+p.filter(Boolean).join(', ');
}

 req:()=>S.prep[k]?'이미 준비를 마쳤습니다':missing(c),
 run(){Object.entries(c).forEach(([a,x])=>S.inv[a]-=x);S.prep[k]=true;return `${i} ${n} 완료! 재난에 한 발 앞서 대비했다.`}}));
function clue(){
  const d=nextDis();if(!d)return '';const L=d.day-S.day;if(L<1||L>3)return '';
  const T=DIS[d.type],sens=S.pet&&((S.pet!=='monkey'&&S.bond>=30)||S.bond>=60);
  return `${T.clue[3-L]}${sens?` (${PI[S.pet]} ${PN[S.pet]}의 감지: ${T.i} ${T.n} 임박!)`:''} <b>D-${L}</b>`;
}
const FOODS=['berry','shellfish','egg','fish','meat','cfish','cmeat','stew','jerky','canned','honey','coconut','water'];
function hitDisaster(d,done){
  d.done=true;const T=DIS[d.type],P=S.prep||{},out=[];
  let prot=(P[T.prep]?.6:0)+(T.prep!=='reinf'&&P.reinf?.2:0)+S.built.shelter*.08+(S.b2.fence?(d.type==='tsunami'&&zb('fence')?.2:.1):0);
  prot=Math.max(0,Math.min(1,prot));
  const base={typhoon:24,tsunami:30,wildfire:20,landslide:24}[d.type]*(S.isle==='volcano'?1.3:1),dmg=Math.round(base*(1-prot));
  if(dmg>0)out.push('🤕 체력 -'+H(dmg,T.n));
  const mp=(1-prot)*.4,lost=[];
  CAPPED.forEach(k=>{const l=Math.floor((S.inv[k]||0)*mp);if(l>0){S.inv[k]-=l;lost.push(ITEMS[k].i+'-'+l)}});
  const fp=P.stash?0:(1-prot)*.6*(S.b2.storage?.5:1);
  FOODS.forEach(k=>{const l=Math.floor((S.inv[k]||0)*fp);if(l>0){S.inv[k]-=l;lost.push(ITEMS[k].i+'-'+l)}});
  if(lost.length)out.push('📦 자원 손실: '+lost.join(' '));
  const cnt=prot<.35?2:prot<.7?1:0,brk=[];
  T.hit.filter(x=>{const [t,k]=x.split(':');return (t==='b'?S.built:S.b2)[k]}).sort(()=>Math.random()-.5).slice(0,cnt).forEach(x=>{const [t,k]=x.split(':');(t==='b'?S.built:S.b2)[k]=false;brk.push(NAMES[k])});
  if(brk.length)out.push('💥 파괴된 시설: '+brk.join(', '));
  if(prot<.25&&S.built.shelter===1&&(d.type==='typhoon'||d.type==='landslide')){S.built.shelter=0;out.push('🏚️ 움막이 무너졌다!')}
  if(prot>=.75){out.push('🎖️ 철저한 대비 덕분에 큰 피해를 막았다! 재난이 남긴 선물: '+T.rew());S.st.dis++;META.dis++;sfx('level')}
  else if(prot<.4)out.push('💡 징조가 보이면 재난 대비 행동을 해 두세요!');
  S.prep={};
  log(`${T.i} [${T.n}] 방어력 ${Math.round(prot*100)}% — `+out.join(' / ').replace(/\n/g,' '));
  modal(`${T.i} ${T.n} 발생!`,`${T.d}<br><br>🛡️ 방어력 <b>${Math.round(prot*100)}%</b><br>${out.join('<br>')||'피해가 없었다.'}`,[{t:'확인',fn:()=>{if(checkDeath())return;save();render();done()}}]);
}

}

  if(S.pet){const b=S.bond;
    if(S.pet==='dog'&&Math.random()<b/150)L.push('🐕 강아지의 사냥감: '+gain('meat',1));
    if(S.pet==='monkey'&&b>=20){L.push('🐒 원숭이의 채집: '+gain('wood',1+(b>=50?1:0)));if(Math.random()<.5)L.push(gain('berry',1))}
    if(S.pet==='parrot'&&b>=30)S.forecast=S.nextWeather}
  if(Math.random()<.78){
    let r=Math.random(),t='normal';for(const [k,p] of [['normal',.32],['military',.2],['locked',.16],['broken',.16],['mystery',.16]]){if(r<p){t=k;break}r-=p}

}

A2({id:'rcall',area:'camp',i:'📡',n:'구조대 교신 시도',get d(){return `배터리 1개, 하루 1회. 성공 확률 약 ${Math.round(radP())}% (안테나·증폭기·날씨·동료 영향)`},cost:2,hide:()=>!S.radioOK,
 req:()=>X().rad.today?'오늘은 이미 교신했습니다':!has('battery',1)?'배터리가 없습니다':null,

  x.rad.prog++;S.rescue++;x.mind=Math.min(100,x.mind+10);

  if(x.rad.prog>=3&&!x.op){x.op={eta:S.day+4,sig:3};setTimeout(()=>modal('🚁 구조 작전 개시!','구조대가 <b>4일 뒤</b> 섬에 도착한다고 응답했다!<br><br>그때까지 <b>신호 강도</b>를 유지해야 한다. 아침마다 신호가 1씩 약해지며 0이 되면 작전이 실패한다. 아침마다 주어지는 임무로 신호를 지켜라!',[{t:'버텨 보자!'}]),0)}
  return m}});

  if(r<.9){const q=x.nq.find(q=>!x.npc[q.id]);if(q){q.day=S.day;return '🆘 희미한 SOS 신호! 누군가 섬에 있다. 내일 아침 찾아올 것 같다.'}return '🎛️ 먼 곳의 SOS는 이미 사라졌다.'}
  x.mind=Math.max(0,x.mind-8);return '👻 "…돌아와… 돌아와…" 소름 끼치는 속삭임이 들렸다. 정신력 -8'}});
RECIPES.push(

function opEv(){
  const x=X(),o=x.op,left=o.eta-S.day;
  return {id:'op',i:'🚁',t:`구조 작전 D-${left}`,d:`구조대가 접근 중이다! 신호 강도 <b>${'📶'.repeat(Math.max(0,o.sig))||'❌'}</b><br>${left}일 더 버텨야 한다. 오늘의 임무를 고르자.`,ch:[
   {t:'🔥 봉화에 땔감을 더한다 (나무 3)',run(){if(!has('wood',3)){o.sig--;return '땔감이 부족해 불이 약해졌다… 신호 -1'}S.inv.wood-=3;o.sig=Math.min(5,o.sig+1);return '불길이 높이 치솟았다. 신호 +1'}},
   {t:'📻 구조대에 위치를 재송신 (배터리 1)',run(){if(!has('battery',1))return '배터리가 없다… 송신하지 못했다.';S.inv.battery--;o.sig=Math.min(5,o.sig+2);return '위치 정보를 보냈다. 신호 +2'}},
   {t:'⚠️ 위험한 고지대에서 신호를 보낸다',run(){if(Math.random()<.5){o.sig=Math.min(5,o.sig+2);return '높은 곳에서 신호가 멀리 퍼졌다! 신호 +2, '+gain(pick(['metal','pearl','meteor']),1)+' 획득'}return '벼랑에서 미끄러졌다! 체력 -'+H(12,'고지대 추락',1)}}]};
}

/* ---------- 거점 자동화 ---------- */
function harvest(){const A=X().au;let n=0;const m=[];A.plots.forEach((v,i)=>{if(v===0){A.plots[i]=-1;n++;m.push(gain('berry',rnd(5,7)));if(Math.random()<.4)m.push(gain('herb',1))}});return n?`🌱 ${n}칸 수확! `+m.filter(Boolean).join(', '):''}
function autoProduce(L){
  const x=X(),A=x.au,rainy=S.prevW==='rain'||S.prevW==='storm';
  if(S.built.barrel&&A.barrel){if(rainy)L.push('🪣 수집기 가동: '+gain('water',2*A.barrel));else if(A.barrel>=3)L.push('🪣 이슬 수집: '+gain('water',1))}
  if(S.built.trap&&A.trap&&Math.random()<.2*A.trap)L.push('🪤 덫 추가 포획: '+gain('meat',1));
  if(S.built.net&&A.net)L.push('🕸️ 어망 추가 포획: '+gain('fish',A.net));
  if(S.built.garden){
    A.plots=A.plots.map(v=>v>0?v-1:v);
    if(S.b2&&S.b2.storage){const h=harvest();if(h)L.push(h+' (📦 창고 자동 정리)')}
    else if(A.plots.includes(0))L.push('🌱 수확할 작물이 익었다! (🏕️ 거점 탭)');
  }
}
window.auUp=k=>{const A=X().au;if(S.over||!S.built[k]||A[k]>=3||S.time<1)return;const c=UC[A[k]];
  if(!Object.entries(c).every(([a,n])=>has(a,n)))return;
  Object.entries(c).forEach(([a,n])=>S.inv[a]-=n);A[k]++;if(k==='garden')A.plots.push(-1);
  log(`🏗️ ${UP[k][0]} Lv.${A[k]} 업그레이드!`,'good');toast('🏗️ 업그레이드 완료');sfx('craft');spend(1);afterAction()};
window.auPlant=()=>{const A=X().au,i=A.plots.indexOf(-1);if(S.over||i<0||!has('berry',2)||S.time<1||!S.built.garden)return;
  S.inv.berry-=2;A.plots[i]=3;log('🌱 씨앗을 심었다. 3일 뒤 수확할 수 있다.');spend(1);afterAction()};
window.auHarv=()=>{if(S.over||S.time<1)return;const h=harvest();if(!h)return;log(h,'good');spend(1);afterAction()};

/* ---------- 생존자 (NPC) ---------- */
function npcEv(id){
  const N=NPC[id],x=X(),R=x.rep,st=x.npc[id]={met:true,join:false,trust:20,gone:false,bet:false};
  return {id:'npc_'+id,i:N.i,t:`${N.n} (${N.p})`,d:N.t,ch:[
   {t:'🍖 식량을 나눠준다',run(){const k=FOODS.find(f=>has(f,1));if(!k){st.trust-=5;return '나눠줄 식량이 없다…'}S.inv[k]--;st.trust+=18;R.help++;x.mind=Math.min(100,x.mind+4);
     if(id==='seoyeon'){heal(8)}return `${ITEMS[k].i}을(를) 나눠줬다. ${N.n}의 표정이 풀렸다. (신뢰 ${st.trust})`+(id==='seoyeon'?' 체력 +8':'')}},
   {t:'🔄 물자를 교환한다 (나무 4)',run(){
     if(R.self>=5||st.trust<0){st.gone=true;return `${N.n}은(는) 당신을 믿지 못하겠다는 듯 고개를 저으며 떠났다. (이기적인 평판 — 거래 불가)`}
     if(!has('wood',4))return '교환할 나무가 부족하다.';S.inv.wood-=4;st.trust+=6;
     let m=gain(N.give[0],N.give[1]);if(id==='minjun'){const r=findRec();if(r)m+='\n'+r}return `${N.n}과(와) 거래했다. ${m} 획득`}},
   {t:'🏕️ 거점에 받아들인다',run(){
     if(S.built.shelter<1)return '재울 움막조차 없다…';
     if(joined().length>=2)return '더 이상 받아줄 공간이 없다.';
     if(id==='cheolsu'&&R.help<2&&st.trust<30){st.gone=true;return '"난 내 방식대로 산다." 철수는 코웃음 치며 떠났다.'}
     st.join=true;st.trust+=12;R.help++;x.mind=Math.min(100,x.mind+8);return `${N.i} ${N.n}이(가) 거점의 식구가 되었다! (매일 식량 1개 소모)`}},
   {t:'🚪 쫓아낸다',run(){st.gone=true;R.self+=2;return `${N.n}은(는) 원망 섞인 눈으로 돌아섰다.`}}]};
}
function npcDaily(L){
  const x=X();
  Object.entries(x.npc).forEach(([id,st])=>{
    if(!st.join||st.gone)return;const N=NPC[id],k=FOODS.find(f=>has(f,1));
    if(k){S.inv[k]--;st.trust=Math.min(100,st.trust+2+(x.rep.help>=5?1:0))}else{st.trust-=12;L.push(`${N.i} ${N.n}이(가) 굶주려 불만을 품는다. (신뢰 ${st.trust})`)}
    x.mind=Math.min(100,x.mind+3);
    if(id==='minjun'&&Math.random()<.35){const r=findRec();if(r)L.push(`${N.i} 민준이 연구 기록을 찾아왔다! `+r)}
    if(id==='seoyeon'){heal(4);if(Math.random()<.35)L.push('👩‍⚕️ 서연이 약초를 캐왔다: '+gain('herb',1))}
    if(id==='cheolsu'){L.push('🧔 철수가 장작을 패왔다: '+gain('wood',2));
      if(st.trust<50&&(x.rep.self>=3||Math.random()<.12)){FOODS.forEach(f=>{const n=Math.floor((S.inv[f]||0)/2);S.inv[f]-=n});if(has('battery',1))S.inv.battery--;st.join=false;st.gone=true;st.bet=true;x.rep.self++;L.push('💔 철수가 식량 절반과 배터리를 훔쳐 보트로 달아났다!')}}
    if(st.trust<10&&st.join){st.join=false;st.gone=true;L.push(`${N.i} ${N.n}이(가) 실망하여 떠났다.`)}
  });
}

/* ---------- 아침 처리 ---------- */
function morning3(){
  const x=X(),L=[];x.rad.today=false;
  autoProduce(L);npcDaily(L);
  ['forest','beach','falls','reef'].forEach(k=>x.eco[k]=Math.min(100,x.eco[k]+5+(x.rep.nat>=5?3:0)));
  const nz=x.noise;
  if(nz>=10){if(S.b2&&S.b2.fence&&Math.random()<.6)L.push('🚧 소음에 이끌린 맹수를 울타리가 막아냈다!');else L.push('🐗 요란한 소음에 이끌려 맹수가 캠프를 습격했다! 체력 -'+H(7,'맹수 습격'))}
  else if(nz<=3&&x.eco.camp>=2&&Math.random()<.5){L.push('🦌 조용한 캠프에 희귀한 동물이 찾아왔다! '+gain(pick(['honey','egg','pearl']),1));x.rep.nat++}
  x.noise=Math.max(0,nz-4);x.eco.camp=Math.max(0,x.eco.camp-.4);
  if(!S.built.fire&&!x.tr.h2&&!(S.b2&&S.b2.fence)&&Math.random()<.3){const s=pick(FOODS.filter(f=>has(f,1))||[]);if(s){S.inv[s]--;L.push(`🦉 야행성 동물이 ${ITEMS[s].i}을(를) 물고 갔다.`)}}
  if(x.rep.nat>=5&&Math.random()<.4)L.push('🌿 숲의 동물들이 선물을 두고 갔다: '+gain(pick(['herb','berry','honey']),1));
  x.mind=clamp(x.mind-5+(S.pet?3:0)+(S.b2&&S.b2.bed?2:0)+(S.built.hammock?2:0),0,100);
  if(x.mind<=0)L.push('😶 정신이 무너질 것 같다… 체력 -'+H(3,'정신 붕괴'));
  if(x.op){x.op.sig--;if(x.op.sig<=0){x.op=null;x.rad.prog=1;L.push('📶 신호가 끊겨 구조대가 방향을 잃었다… 작전 실패. 다시 교신해야 한다.')}}
  L.filter(Boolean).forEach(l=>log(l,'sys'));
  if(L.length)toast('🌅 거점 소식 '+L.length+'건 (일지 확인)');
}

function advance(){
  S.day++;S.time=12;S.weather=S.nextWeather;S.nextWeather=pickWeather(S.day+1);setForecast();S.signalToday=false;
  META.infBest=Math.max(META.infBest,S.day);
  log(`♾️ ${S.day}일차 — 오늘 날씨: ${WEATHER[S.weather].i} ${WEATHER[S.weather].n}`,'sys');
  ambient();save();render();
  modal(`♾️ ${S.day}일차 아침`,'밤이 지나갔다. 섬의 재난은 점점 거세진다…',[{t:'아침을 맞이한다',fn:()=>{sfx('morning');showEvent()}}]);
}

  return {id:'inf',i:'🌩️',t:`섬의 분노 Lv.${lv}`,d:'섬의 에너지가 폭주해 거대한 재난이 닥친다!',ch:[
   {t:'🛡️ 자재로 방어한다 (나무 8, 돌 4)',run(){if(!has('wood',8)||!has('stone',4))return '자재가 부족하다! 체력 -'+H(d,'섬의 분노');S.inv.wood-=8;S.inv.stone-=4;return '방어 성공! '+gain(pick(['meteor','pearl','metal']),1)+' 획득'}},
   {t:'💪 정면으로 버틴다',run(){return '폭풍을 정면으로 맞았다! 체력 -'+H(d,'섬의 분노')+(Math.random()<.5?' / '+gain('meteor',1)+' 획득':'')}}]}}
function rivalEv(){const lv=Math.floor((S.day-30)/5)+1;

const _se=showEvent;
showEvent=function(){
  if(!S||S.over)return _se();
  const x=X();morning3();
  if(checkDeath())return;
  if(x.op&&S.day>=x.op.eta){ending('op');return}
  let ev=null;
  if(x.op)ev=opEv();
  else{const q=x.nq.find(q=>!x.npc[q.id]&&S.day>=q.day);
    if(q)ev=npcEv(q.id);
    else if(x.inf&&S.day>30){if(S.day%3===0)ev=infEv();else if(S.day%5===0)ev=rivalEv()}}

  let w=_pw(d);const x=S&&S.x4;
  if(x&&d!==10&&d!==20&&d!==25&&!(S.dis&&S.dis.some(z=>z.day===d))){
    const c=x.climate,r=Math.random();
    if(c==='wet'&&(w==='clear'||w==='cloudy')&&r<.3)w='rain';
    else if(c==='dry'&&w==='rain'&&r<.5)w='clear';
    else if(c==='dry'&&w==='clear'&&r<.15)w='heat';
    else if(c==='stormy'&&w!=='storm'&&r<.12)w='storm';
    if(x.rules&&x.rules.storm&&w!=='storm'&&Math.random()<.12)w='storm';
  }
  return w;
};

 ship:()=>({id:'sev_ship',i:'🚢',t:'좌초한 유령선',d:'폭풍 뒤 해안에 거대한 유령선이 좌초해 있다. 이 섬에만 일어나는 일이다.',ch:[
  {t:'갑판을 수색한다 (⏱2)',run(){spend(2);let t='선실에서 '+[gain('rparts',2),gain('battery',2),gain('canned',2)].filter(Boolean).join(', ')+' 획득!';if(Math.random()<.25)t+='\n썩은 갑판이 무너졌다! 체력 -'+H(8,'선체 붕괴',1);return t}},
  {t:'밧줄만 풀어온다',run:()=>'안전하게 '+gain('fiber',6)+' 획득'}]}),
 spirit:()=>({id:'sev_spirit',i:'🗿',t:'유물의 속삭임',d:'꿈속에서 누군가 이 섬의 어딘가를 가리켰다. 눈을 뜨자 손에 낯선 문양이 새겨져 있다.',ch:[
  {t:'속삭임을 따라간다 (⏱2)',run(){spend(2);const c=Object.keys(ART).filter(k=>!S.art.own.includes(k));if(!c.length)return '이미 모든 유물을 지녔다. '+gain('rparts',3)+' 획득';return giveArt(pick(c))+'\n숲의 기운에 몸이 무겁다. 체력 -'+H(5,'유물의 기운')}},
  {t:'무시하고 쉰다',run(){heal(8);return '꿈이었을 뿐이다. 체력 +8'}}]})
};
function visitEv(){
  return{id:'sigvis',i:'🚢',t:'신호를 보고 찾아온 배',d:'당신의 구조 신호가 먼 곳까지 닿았다. 정체 모를 배가 섬에 접근한다… 신호는 좋은 사람들만 부르지 않는다.',ch:[
   {t:'📡 교신한다',run(){if((S.radioOK||S.built.signal)&&Math.random()<.6){S.rescue++;return '우호적인 상선이었다! 물자를 던져주고 갔다. '+[gain('canned',2),gain('battery',1)].filter(Boolean).join(', ')+' / 구조 신호 +1'}return '약탈자였다! 상륙해 물자를 털어갔다. '+steal()+' 체력 -'+H(6,'약탈자')}},
   {t:'🙈 모닥불을 끄고 숨는다',run(){heal(2);S.rescue=Math.max(0,S.rescue-1);return '숨죽이고 기다리자 배는 멀어졌다. (구조 신호 -1, 위험도 감소)'}},
   {t:'🏹 해안에서 경계한다 (⏱2)',run(){spend(2);if(S.tools.spear||Math.random()<.4)return '무장한 모습을 보이자 배는 물러갔다. '+gain('metal',1);return '경계하다 기습당했다! 체력 -'+H(9,'약탈자',1)}}]};
}
function forced4(){
  const x=S.x4;
  if(!x.sevDone&&S.day>=x.sevDay){x.sevDone=true;return SEV[x.sev]()}
  const dg=S.w.danger;if(dg>=1&&Math.random()<.18+dg*.08)return visitEv();
  return null;
}
function evt4(ev,after){
  META.events[ev.id]=1;saveMeta();sfx('event');
  modal(`${ev.i} ${ev.t}`,ev.d,ev.ch.map(c=>({t:c.t,fn:()=>{
    const r=c.run();log(`${ev.i} [${ev.t}] ${r}`);
    modal(`${ev.i} ${ev.t}`,r.replace(/\n/g,'<br>'),[{t:'확인',fn:()=>{if(checkDeath())return;save();render();after&&after()}}]);
  }})));
}
const _se=showEvent;
showEvent=function(){
  if(!S||S.over)return _se();
  E4();morning4();
  if(checkDeath())return;
  const ev=forced4();
  if(ev)evt4(ev,()=>_se());else _se();
};

/* ---------- 시작 · 결과 ---------- */
const _sg=startGame;
startGame=function(k,c){
  _sg(k,c);
  S.x4=null;S.w=null;S.art=null;S.dg=null;dgLive=false;
  const sd=(S.x&&S.x.seed)||1;
  S.x4=Object.assign({seed:sd,rules:JSON.parse(JSON.stringify(PICK4.rules)),today:0,tc:0,dr:'',cove:false,sevDone:false,dgRuns:0,dgMax:0,pj:{},fin:false,spr:false},profile(sd));
  E4();
  if(S.isle==='treasure')S.dv.dmg=+(S.dv.dmg/1.2).toFixed(2);
  S.isle=S.x4.isle;if(S.isle==='treasure')S.dv.dmg=+(S.dv.dmg*1.2).toFixed(2);
  const pk=PICK4,u=HUB().unl,lg=[];
  if(pk.tool&&u['t_'+pk.tool]){S.tools[pk.tool]=1;lg.push('도구')}
  if(pk.pkg&&u['p_'+pk.pkg]){
    if(pk.pkg==='sailor'){S.tools.rod=1;S.built.rope=true;gain('wood',4);gain('fiber',4)}
    if(pk.pkg==='scholar'){gain('mappiece',2);gain('torch',3);gain('battery',1)}
    if(pk.pkg==='medic'){gain('salve',2);gain('medkit',1);gain('herb',3)}
    lg.push('패키지')}
  if(pk.area&&u['a_'+pk.area]){S.unlocked[pk.area]=true;lg.push('시작 지역')}
  if(u.b_cache){gain('wood',8);gain('stone',4);gain('fiber',4)}
  if(u.b_kit){gain('salve',1);gain('canned',2)}
  if(u.b_lab){gain('torch',4);gain('battery',1)}
  if(pk.art&&META.arts[pk.art]){giveArt(pk.art);lg.push('유물')}
  if(S.x4.rules.nomap)S.tab='inv';
  S.nextWeather=pickWeather(2);setForecast();
  const I=ISL4[S.isle],C=CLIM[S.x4.climate],r=S.x4.rules;
  const geoS=AREAS4.filter(a=>S.x4.geo[a]!==1).map(a=>`${AREAS[a].i}${S.x4.geo[a]>1?'🟢':'🔴'}`).join(' ');
  log(`🌐 시드 #${sd} — ${I[1]} · ${C[1]}${rcount(r)?' · 규칙: '+rkey(r):''}`,'sys');
  save();render();
  modal(`${I[0]} ${I[1]}에 표류했다`,`배가 난파되어 낯선 무인도에 홀로 떠밀려왔다. <b>30일</b>만 버티면 구조선이 지나갈 것이다.<br><br>🌐 <b>시드 #${sd}</b> — ${ISD[S.isle]}<br>${C[0]} ${C[1]}<br>🗺️ 지역 자원: ${geoS||'모두 보통'} <small>(🟢 풍부 🔴 빈약)</small><br>📅 고유 사건: <b>${S.x4.sevDay}일차</b> 무렵 이 시드만의 사건이 일어납니다.<br>${rcount(r)?`🏆 규칙: <b>${esc(rkey(r))}</b> (점수 ×${rmult(r).toFixed(2)})<br>`:''}${lg.length?`🎒 해금 선택 적용: ${lg.join(', ')}<br>`:''}<small>🕯️ 동굴·유적의 심층 탐사, 🏗️ 프로젝트, 🗿 유물 탭을 활용해 보세요.</small>`,[{t:'생존을 시작한다!',fn:()=>sfx('morning')}]);
};
function recordRun4(total,dead){
  const x=S.x4,hub=HUB(),r=x.rules,rc=rcount(r),mult=rmult(r),key=rkey(r),sd=x.seed,wi=weekInfo(),se=season();
  const cs=META.cs[key]=META.cs[key]||{best:0,plays:0,wins:0};cs.plays++;
  const sb=META.seedBest[sd]=META.seedBest[sd]||{best:0,plays:0,day:0};sb.plays++;sb.day=Math.max(sb.day,S.day);
  let h=`<div class="info2" style="margin-top:10px">🧭 <b>확장팩 4 기록</b><br>🌐 시드 #${sd} (${ISL4[x.isle][1]}) · 🏷️ ${esc(key)}<br>🕯️ 심층 탐사 ${x.dgRuns}회 (최고 깊이 ${x.dgMax}) · 🗿 유물 ${S.art.own.length}개 · 🏗️ 프로젝트 ${Object.keys(PRJ).filter(pjDone).length}/4<br>`;
  if(dead){const ep=Math.floor(S.day/3)+x.dgMax;hub.ep+=ep;h+=`💀 이번 판 EP <b>+${ep}</b> (심층 탐사 기록 포함)`}
  else{
    const fin=Math.round(total*mult),nb=fin>cs.best,snb=fin>sb.best;cs.wins++;cs.best=Math.max(cs.best,fin);sb.best=Math.max(sb.best,fin);
    let ep=8+Math.floor(fin/200)+rc*4+x.dgMax+(nb?3:0),extra='';
    if(sd===wi.seed){const wk=META.wk[wi.w]=META.wk[wi.w]||{best:0,seed:sd};wk.best=Math.max(wk.best,fin);extra+='<br>📅 주간 시드 도전 기록 갱신!'}
    if(sameRules(r,se.r)&&!META.seasonClear[se.id]){META.seasonClear[se.id]=1;ep+=30;extra+=`<br>🍂 시즌 클리어 보너스 EP +30 (${se.n})`}
    const st={};['wood','stone','fiber','metal','pearl','herb','rparts'].forEach(k=>{const q=Math.min(15,Math.floor((S.inv[k]||0)*.3));if(q>0){hub.store[k]=(hub.store[k]||0)+q;st[k]=q}});
    hub.ep+=ep;
    h+=`🏆 규칙 배수 ×${mult.toFixed(2)} → 챌린지 점수 <b>${fin}</b> ${nb?'🎉 이 규칙 조합 신기록!':`<small>(조합 최고 ${cs.best})</small>`}<br>🌐 이 시드 최고 <b>${sb.best}</b>점 ${snb?'🎉':''} (도전 ${sb.plays}회)${extra}<br>🧭 EP <b>+${ep}</b> · 📦 원정 물자 적립: ${invStr(st)}`;
  }
  saveMeta();return h+'<br><small>🧭 원정 본부에서 EP로 새 시작 선택지를 해금하세요.</small></div>';
}
const _modal=modal;
modal=function(t,b,btns,w){
  let tag=false,dead=false;
  try{
    M4();if(S&&S.over){E4();if(!S.x4.fin){tag=b.indexOf('class="es es-')>-1;dead=/생존 실패/.test(t);if(tag||dead)btns=(btns||[]).concat([{t:'🧭 원정 본부 (해금·원정)',fn:()=>openHub('menu')}])}}
    if(/난이도/.test(t)){b+=startExtra4();btns=(btns||[]).concat([{t:'🧭 원정 본부 · 영구 해금',fn:()=>openHub('menu')}])}
  }catch(e){}
  _modal(t,b,btns,w);
  try{if(tag||dead){S.x4.fin=true;const mb=$$('mb'),m=/최종 총점\s*(\d+)/.exec(mb.textContent)||/점수\s*(\d+)/.exec(mb.textContent);mb.insertAdjacentHTML('beforeend',recordRun4(m?+m[1]:0,dead))}}catch(e){}
};

/* ---------- 렌더 ---------- */
const _render=render;
render=function(){
  if(!S)return;
  const x=E4();
  if(S.dg&&S.dg.on&&!dgLive){dgLive=true;dgEnd('retreat')}
  if(x.rules.nomap&&S.tab==='map')S.tab='inv';
  _render();
  const tb=$$('tabs');
  if(x.rules.nomap)[...tb.children].forEach(b=>{if(/지도/.test(b.textContent))b.remove()});
  [['proj','🏗️ 프로젝트'],['art','🗿 유물'],['world','🌍 세계']].forEach(([k,t])=>{
    const e=document.createElement('button');e.textContent=t;e.className=S.tab===k?'on':'';
    e.onclick=()=>{S.tab=k;render()};tb.appendChild(e);
  });
  const side=$$('side');
  if(S.tab==='proj')side.innerHTML=projTab();
  else if(S.tab==='art')side.innerHTML=artTab();
  else if(S.tab==='world')side.innerHTML=worldTab();
  // 발전 시설로 하루가 12시간을 넘을 때 표시 보정
  $$('v-time').textContent=`${6+Math.max(0,12-S.time)}:00 (${S.time}h${S.time>12?' 🌙+'+(S.time-12):''})`;
  $$('b-time').style.width=Math.min(100,S.time/12*100)+'%';
  // 안내 줄
  let ln=`🌐 #${x.seed} ${ISL4[x.isle][0]} ${CLIM[x.climate][0]}`;
  if(S.art.eq.length)ln+=' · '+S.art.eq.map(id=>ART[id].i).join('');
  const sy=SYN.filter(s=>s.on());
  if(sy.length)ln+=' · 🔮 '+sy.map(s=>s.n).join(', ');
  const pj=Object.keys(PRJ).filter(k=>pjS(k)>0&&!pjDone(k)).map(k=>`${PRJ[k].i}${pjS(k)}/${PRJ[k].st.length}`);
  if(pj.length)ln+=' · 🏗️ '+pj.join(' ');
  if(x.rules.act)ln+=` · ⏱️ 행동 ${x.today}/${x.rules.act}${limitHit()?' 🚫 소진(잠자기)':''}`;
  const dd=DAILY.find(d=>d.id===x.dr);
  if(dd)ln+=' · '+dd.n;
  if(S.w.danger>0)ln+=` · ⚠️ 위험도 ${S.w.danger}`;
  $$('hint').innerHTML+=`<br><small>${ln}</small>`;
  // 캠프 장면: 복구 프로젝트 반영
  $$('sc-art').textContent+=' '+(pjDone('dock')?'🚢':'')+(pjS('power')?'⚡':'')+(pjDone('water')?'⛲':'')+(pjS('ruin')?'🏚️':'');
};

/* ---------- 업적 · 튜토리얼 ---------- */
ACH.push(
 {id:'e1',i:'🕯️',n:'심연의 탐험가',d:'심층 탐사에서 깊이 8 도달',f:()=>META.hub&&META.hub.dgmax>=8},
 {id:'e2',i:'🗿',n:'유물 수집가',d:'유물 5종 발견',f:()=>Object.keys(META.arts||{}).length>=5},
 {id:'e3',i:'🔮',n:'시너지 마스터',d:'유물 시너지 2개 동시 발동',f:()=>S.x4&&SYN.filter(s=>s.on()).length>=2},
 {id:'e4',i:'🏗️',n:'섬의 개척자',d:'복구 프로젝트 4종 모두 완성',f:()=>S.x4&&Object.keys(PRJ).every(pjDone)},
 {id:'e5',i:'⛵',n:'첫 원정',d:'원정 1회 완료',f:()=>META.hub&&META.hub.trips>=1},
 {id:'e6',i:'🏴',n:'원정 대장',d:'원정 5회 완료',f:()=>META.hub&&META.hub.trips>=5},
 {id:'e7',i:'🏆',n:'규칙 파괴자',d:'규칙 3개 이상 조합으로 클리어',f:()=>Object.entries(META.cs||{}).some(([k,v])=>v.wins>0&&k!=='기본'&&k.split('+').length>=3)},
 {id:'e8',i:'🍂',n:'시즌 챔피언',d:'시즌 규칙 클리어',f:()=>Object.keys(META.seasonClear||{}).length>=1},
 {id:'e9',i:'📅',n:'주간 도전자',d:'주간 추천 시드 클리어',f:()=>Object.keys(META.wk||{}).length>=1}
);
TUT.splice(TUT.length-1,0,{t:'🧭 확장팩 4',h:()=>`<ul class="tl">
 <li>🌐 <b>시드</b>: 시드 번호가 섬 유형·기후·지역별 자원 분포(🟢풍부/🔴빈약)·고유 사건(9~18일차)을 정합니다. 같은 번호를 입력하면 같은 섬을 다시 플레이할 수 있고, 📅 <b>주간 추천 시드</b>로 내 기록을 갱신할 수 있습니다.</li>
 <li>🕯️ <b>심층 탐사</b>: 동굴·고대 유적에서 횃불 2개 이상을 챙겨 들어갑니다. 방(문)을 고를 때마다 횃불이 1개씩 닳고, 문의 단서는 틀릴 수도 있습니다. 깊이 5·8에는 수호자가 있고, <b>철수하면 전리품을 지키지만 횃불이 0이 되면 40%를 잃습니다.</b> 유물은 여기서 얻습니다.</li>
 <li>🏗️ <b>복구 프로젝트</b>(🏗️ 탭): 부두(먼 바다 개방) · 발전 시설(하루 +1~2시간) · 샘 정화(매일 물) · 폐허(교환소). 자재 투입 → 여러 번 작업해야 한 단계가 끝납니다.</li>
 <li>🗿 <b>유물 빌드</b>: 슬롯 2개(조건 달성 시 3개)에 유물을 장착합니다. 나침반+지도첩, 수정+빗물 수집기처럼 <b>조합하면 시너지</b>가 발동합니다.</li>
 <li>🌍 <b>반응하는 세계</b>: 한 지역만 계속 채집하면 고갈되고, 5일 이상 찾지 않으면 새 흔적이 생깁니다. 구조 신호를 많이 보내면 낯선 배가 찾아옵니다.</li>
 <li>🧭 <b>원정 본부</b>(상단 버튼): 엔딩과 심층 탐사로 얻은 <b>EP</b>로 시작 도구·패키지·지역·유물·고급 규칙을 해금하고, 배를 개조해 5개 해역으로 원정을 떠납니다. 원정 물자로 매 판 시작 보급이 강해집니다. 영구 보상은 <b>능력치가 아니라 선택지</b>입니다.</li>
 <li>🏆 <b>챌린지 규칙 조합</b>: 행동 제한·재료 금지·지도 없음·매일 규칙·장비 제한·폭풍을 조합하면 조합별 별도 점수표와 배수가 적용됩니다. 🍂 시즌 규칙도 있습니다.</li></ul>`});

/* ---------- 초기화 ---------- */
const hb=document.querySelector('header .btns');
if(hb&&!$$('b-hub')){
  const b=document.createElement('button');b.id='b-hub';b.textContent='🧭 원정 본부';
  b.onclick=()=>openHub('game');hb.insertBefore(b,hb.firstChild);
}
M4();
if(S&&!S.over)E4();
render();
if($$('ov').classList.contains('show')&&/난이도/.test($$('mt').textContent))showStartMenu(false);
})();
</script>
